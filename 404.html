<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Ilya Panko</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="Page not found — Ilya Panko portfolio." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem("theme");
          lang = localStorage.getItem("lang");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.dataset.theme = theme;
        if (lang === "ru" || lang === "en") root.dataset.lang = lang;
      })();
    </script>
    <style>
      .notfound {
        min-height: calc(100vh - 64px - 72px);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 72px 0 96px;
      }
      .notfound .kicker {
        justify-content: center;
      }
      .notfound h1 {
        margin: 8px 0 0;
        font-size: clamp(72px, 12vw, 140px);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
      .notfound p {
        max-width: 46ch;
        margin: 16px auto 24px;
        color: var(--muted);
      }
      .notfound .hero-actions {
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html">
          Ilya Panko <small>— .NET / React / AI</small>
        </a>
        <nav class="nav">
          <button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch color theme">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <button class="lang-toggle" data-lang-toggle type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
            <span data-lang-label>RU</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="notfound">
        <div class="container">
          <p class="kicker">404</p>
          <h1>404</h1>
          <p>
            <span class="i18n-en">This page does not exist. It may have moved, or the link is wrong.</span>
            <span class="i18n-ru">Такой страницы нет. Возможно, она переехала или ссылка неверная.</span>
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="index.html">
              <span class="i18n-en">Back to portfolio</span>
              <span class="i18n-ru">На главную</span>
            </a>
            <a class="btn btn-outline" href="index.html#projects">
              <span class="i18n-en">View projects</span>
              <span class="i18n-ru">Смотреть проекты</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© <span id="year"></span> Ilya Panko</span>
        <span>
          <span class="i18n-en">Built as a static site.</span>
          <span class="i18n-ru">Статический сайт.</span>
        </span>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="script.js"></script>
  </body>
</html>
